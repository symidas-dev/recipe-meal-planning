name: CI / CD Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  # -------------------------------------------------------------------
  # Job 1: Build, Unit Tests & Containerized DB Integration Tests
  # -------------------------------------------------------------------
  build-and-test:
    name: Build & Verify (Java 21, Maven, Testcontainers)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Eclipse Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Make Maven Wrapper Executable
        run: chmod +x mvnw
        working-directory: .

      - name: Run Unit Tests & Verify
        run: ./mvnw clean test -B
        working-directory: .

  # -------------------------------------------------------------------
  # Job 2: Multi-stage Docker Container Build Verification
  # -------------------------------------------------------------------
  docker-smoke-build:
    name: Docker Multi-Stage Image Build
    needs: build-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image (Smoke Test)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: recipe-meal-planning:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
