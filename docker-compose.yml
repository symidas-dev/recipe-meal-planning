services:
  postgres:
    image: postgres:17-alpine
    container_name: recipe-meal-planning-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-recipemealplanning}
      POSTGRES_USER: ${POSTGRES_USER:-planner}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-planner_secret_pw}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-planner} -d ${POSTGRES_DB:-recipemealplanning}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - app-network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: recipe-meal-planning-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-docker}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-recipemealplanning}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-planner}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-planner_secret_pw}
      SERVER_PORT: 8080
    ports:
      - "${SERVER_PORT:-8080}:8080"
    networks:
      - app-network

volumes:
  postgres_data:
    driver: local

networks:
  app-network:
    driver: bridge
